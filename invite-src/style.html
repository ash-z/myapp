<title>Sai Susmita weds Ashish</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Marcellus&family=Karla:wght@300;400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&display=swap">
<style>
/* ============ PALETTE — ivory (light, default) / jewel (dark) ============ */
:root{
  --bg:#F7F2E8; --bg2:#EFE6D5; --ink:#2B2318;
  --gold:#A97C2B; --accent:#9A3A32; --muted:#7A6A55;
  --surface:#FFFCF6; --rule:rgba(169,124,43,.28); --card:rgba(169,124,43,.06);
  --shadow:0 24px 50px -20px rgba(70,45,15,.42);
  --bg-a0:rgba(247,242,232,0);
  --tab-h:66px;
  --maxw:980px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17100F; --bg2:#241419; --ink:#F5E9D4;
    --gold:#DCB262; --accent:#B9515C; --muted:#B39E8A;
    --surface:#2A1C1F; --rule:rgba(220,178,98,.26); --card:rgba(220,178,98,.07);
    --shadow:0 24px 50px -20px rgba(0,0,0,.75);
    --bg-a0:rgba(23,16,15,0);
  }
}
:root[data-theme="dark"]{
  --bg:#17100F; --bg2:#241419; --ink:#F5E9D4;
  --gold:#DCB262; --accent:#B9515C; --muted:#B39E8A;
  --surface:#2A1C1F; --rule:rgba(220,178,98,.26); --card:rgba(220,178,98,.07);
  --shadow:0 24px 50px -20px rgba(0,0,0,.75);
  --bg-a0:rgba(23,16,15,0);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-snap-type:y proximity;scroll-behavior:smooth}
html.locked,html.locked body{overflow:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Karla","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:300;font-size:16px;line-height:1.65;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
::selection{background:var(--gold);color:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:20px}
.telugu{font-family:"Noto Sans Telugu","Nirmala UI",sans-serif;letter-spacing:.02em}
.eyebrow{font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.eyebrow.telugu{letter-spacing:.08em;text-transform:none;font-size:13.5px}

/* ============ OPENING SCREEN ============ */
.splash{display:none}
.js .splash{
  display:flex;position:fixed;inset:0;z-index:100;
  align-items:center;justify-content:center;text-align:center;
  padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 78% at 50% 36%,var(--surface) 0%,var(--bg) 52%,var(--bg2) 100%);
  transition:transform 1s cubic-bezier(.76,0,.24,1);
}
.js.opened .splash{display:none}
.splash.gone{transform:translateY(-102%)}
.sp-inner{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:520px}
.sp-inner .invocation{margin:0;font-size:13px;color:var(--accent)}
.seal{
  position:relative;width:min(56vw,224px);aspect-ratio:1;margin:6px 0 4px;
  border:0;padding:0;background:none;cursor:pointer;
  animation:breathe 3.8s ease-in-out infinite;
}
.seal svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.seal .mono{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:"Italiana",Georgia,serif;font-size:clamp(30px,9vw,42px);letter-spacing:.08em;color:var(--ink);
}
@keyframes breathe{50%{transform:scale(1.035)}}
.splash.opening .seal{animation:none;transform:scale(1.6) rotate(50deg);opacity:0;transition:transform 1s cubic-bezier(.6,0,.2,1),opacity .7s ease}
.sp-names{margin:0;font-family:"Italiana",Georgia,serif;font-weight:400;font-size:clamp(36px,10.5vw,60px);letter-spacing:.04em;line-height:1.05}
.sp-names .n{display:block}
.sp-names .amp{display:block;margin:.12em 0 .08em;font-family:"Marcellus",Georgia,serif;font-size:.42em;color:var(--gold)}
.sp-names .n{white-space:nowrap}
@media (min-width:700px){.sp-inner{max-width:820px}.sp-names .n,.sp-names .amp{display:inline}.sp-names .amp{margin:0 .28em;vertical-align:middle}}
.sp-date{margin:0;font-family:"Marcellus",Georgia,serif;font-size:13px;letter-spacing:.34em;color:var(--muted)}
.open-btn{
  margin-top:16px;border:0;border-radius:999px;cursor:pointer;
  padding:15px 30px;background:var(--gold);color:var(--bg);
  font-weight:600;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
  box-shadow:0 12px 26px -10px rgba(120,80,20,.6);
  transition:transform .15s ease,box-shadow .2s ease;
}
.open-btn:active{transform:scale(.96)}
.sp-a{animation:rise .9s cubic-bezier(.2,.7,.3,1) both}
.sp-a:nth-child(2){animation-delay:.12s}.sp-a:nth-child(3){animation-delay:.3s}
.sp-a:nth-child(4){animation-delay:.42s}.sp-a:nth-child(5){animation-delay:.54s}.sp-a:nth-child(6){animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.seal.sp-a{animation:rise .9s cubic-bezier(.2,.7,.3,1) .12s both,breathe 3.8s ease-in-out 1.2s infinite}

/* ============ PALETTE TOGGLE ============ */
.pal{
  position:fixed;top:env(safe-area-inset-top,0px);right:0;z-index:40;
  margin:12px 12px 0 0;display:flex;gap:2px;padding:3px;
  border:1px solid var(--rule);border-radius:999px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.pal button{
  font-weight:500;font-size:10px;line-height:1;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);background:none;border:0;border-radius:999px;padding:7px 11px;cursor:pointer;
}
.pal button[aria-pressed="true"]{background:var(--gold);color:var(--bg)}

/* ============ TAB BAR ============ */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;
  padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));
  transition:transform .7s cubic-bezier(.2,.8,.2,1) .35s;
  pointer-events:none;
}
.js:not(.ui) .tabs{transform:translateY(140%)}
.tabs-in{
  pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);
  width:min(520px,100%);height:var(--tab-h);padding:5px;gap:2px;
  border:1px solid var(--rule);border-radius:24px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 14px 34px -14px rgba(0,0,0,.35);
}
.tabs a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:19px;text-decoration:none;color:var(--muted);
  font-weight:500;font-size:10.5px;letter-spacing:.02em;
  transition:background .25s ease,color .25s ease;
}
.tabs a svg{width:21px;height:21px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tabs a[aria-current="true"]{color:var(--ink);background:var(--card)}
.tabs a[aria-current="true"] svg{color:var(--gold);transform:translateY(-1px) scale(1.08)}

/* ============ SCREENS ============ */
.screen{
  position:relative;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;
  padding-block:clamp(72px,11vh,108px) calc(var(--tab-h) + 44px + env(safe-area-inset-bottom,0px));
  scroll-snap-align:start;background:var(--bg);--notch:var(--bg);
}
.screen.alt{background:var(--bg2);--notch:var(--bg2)}
.head{text-align:center;margin-bottom:clamp(26px,5vw,44px)}
.head h2{margin:10px 0 0;font-family:"Italiana",Georgia,serif;font-weight:400;font-size:clamp(30px,7.6vw,46px);letter-spacing:.04em;text-wrap:balance}
.note{margin:clamp(22px,4vw,32px) auto 0;max-width:30em;text-align:center;font-size:13px;color:var(--muted)}

/* ============ HERO — THE BAY ============ */
.hero{
  isolation:isolate;overflow:hidden;align-items:center;
  background:linear-gradient(#1B0D14 0%,#3E1520 34%,#8B3A24 62%,#D07B33 84%,#5E2418 100%);
}
#bay{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:-2;touch-action:pan-y}
.hero::after{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 68% at 50% 42%,rgba(20,8,12,0) 32%,rgba(20,8,12,.62) 100%);
}
.plate{position:relative;text-align:center;padding-inline:20px;max-width:640px}
.plate .invocation{margin:0 0 14px;font-size:clamp(11px,2.8vw,13.5px);color:#F5D79B;text-shadow:0 1px 14px rgba(20,8,12,.95)}
.hero-eyebrow{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:16px}
.hero-eyebrow i{display:block;width:22px;height:1px;background:rgba(245,215,155,.45)}
.hero-eyebrow span{color:#F5D79B;text-shadow:0 1px 12px rgba(20,8,12,.9)}
.names{margin:0;line-height:.95}
.nm{display:block;font-family:"Italiana",Georgia,serif;font-weight:400;font-size:clamp(46px,13.5vw,84px);letter-spacing:.05em;color:#FBF3E4;text-shadow:0 2px 34px rgba(20,8,12,.95)}
.weds{display:block;font-family:"Marcellus",Georgia,serif;font-size:clamp(11px,3vw,15px);letter-spacing:.46em;text-indent:.46em;text-transform:uppercase;color:#F0C476;margin:.6em 0 .5em;text-shadow:0 1px 16px rgba(20,8,12,.95)}
.hero-when{margin:1.3em 0 0;font-family:"Marcellus",Georgia,serif;font-size:clamp(12.5px,3.3vw,16px);letter-spacing:.18em;text-transform:uppercase;color:#FBF3E4;text-shadow:0 1px 16px rgba(20,8,12,.95)}
.hero-where{margin:.6em 0 0;font-size:clamp(10.5px,2.7vw,12.5px);letter-spacing:.16em;text-transform:uppercase;color:rgba(251,243,228,.88);text-shadow:0 1px 14px rgba(20,8,12,.98)}
.hint{
  position:relative;margin:clamp(30px,6vh,52px) 0 0;text-align:center;
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(251,243,228,.75);text-shadow:0 1px 12px rgba(20,8,12,.9);transition:opacity .8s ease;
}
.hint::before{
  content:"";display:block;width:7px;height:7px;margin:0 auto 14px;border-radius:50%;
  background:#F5D79B;box-shadow:0 0 0 0 rgba(245,215,155,.6);animation:ping 2.2s ease-out infinite;
}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(245,215,155,.55)}80%,100%{box-shadow:0 0 0 18px rgba(245,215,155,0)}}

/* ============ US — THE DECK ============ */
.deck-wrap{perspective:1100px}
.deck{
  position:relative;width:min(74vw,320px);aspect-ratio:4/5;margin:0 auto;
  touch-action:pan-y;-webkit-user-select:none;user-select:none;outline-offset:14px;
  transform:rotateX(calc(var(--ry,0) * .5deg)) rotateY(calc(var(--rx,0) * .5deg));
  transition:transform .3s ease-out;
}
.card{
  position:absolute;inset:0;margin:0;border-radius:22px;
  will-change:transform;cursor:grab;
}
.card.top:active{cursor:grabbing}
.card-in,.card-face{position:absolute;inset:0;border-radius:inherit}
.card-face{overflow:hidden;box-shadow:var(--shadow);background:#b98a4a}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ph{position:absolute;inset:0}
.ph::before{ /* kolam dot lattice */
  content:"";position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(circle,rgba(255,244,220,.9) 1.3px,transparent 1.8px);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(75% 60% at 50% 42%,#000 20%,transparent 75%);
          mask-image:radial-gradient(75% 60% at 50% 42%,#000 20%,transparent 75%);
}
.ph-her {background:linear-gradient(158deg,#F0B444 0%,#D8612F 46%,#9A2E33 100%)}
.ph-him {background:linear-gradient(158deg,#EAD6AC 0%,#BF9254 48%,#6A4526 100%)}
.ph-both{background:linear-gradient(158deg,#F3CE7A 0%,#C4492E 52%,#3A1F1C 100%)}
.ph-mono{
  position:absolute;left:0;right:0;top:34%;transform:translateY(-50%);text-align:center;
  font-family:"Italiana",Georgia,serif;font-size:clamp(84px,24vw,120px);line-height:1;
  color:rgba(255,248,232,.82);text-shadow:0 6px 30px rgba(60,20,10,.25);
}
.cap{
  position:absolute;left:0;right:0;bottom:0;padding:48px 18px 16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  background:linear-gradient(to top,rgba(24,12,10,.62),rgba(24,12,10,0));color:#FFF7EA;
}
.cap-name{font-family:"Italiana",Georgia,serif;font-size:clamp(24px,6.4vw,30px);letter-spacing:.04em;line-height:1.1}
.cap-tel{font-size:14px;color:#F5D79B}
.soon{
  position:absolute;top:14px;left:14px;padding:5px 10px;border-radius:999px;
  font-weight:500;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:#FFF7EA;background:rgba(30,14,10,.28);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
/* personality: she sways, he stays still */
.card.top[data-mood="her"] .card-face{animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg) translateY(-3px)}}
.card-in.pop{animation:pop .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.9) rotate(-3deg)}100%{transform:none}}
.card-in.settle{animation:settle 1.4s cubic-bezier(.2,.7,.2,1)}
@keyframes settle{0%{transform:translateY(10px);filter:brightness(.9)}100%{transform:none;filter:none}}
.deck-ui{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:clamp(22px,4vh,34px)}
.dots{display:flex;gap:8px}
.dot{width:8px;height:8px;padding:0;border:0;border-radius:99px;background:var(--rule);cursor:pointer;transition:width .35s cubic-bezier(.3,1.4,.5,1),background .3s}
.dot[aria-pressed="true"]{width:26px;background:var(--gold)}
.swipe-cue{margin:0;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);transition:opacity .6s ease}
.swipe-cue svg{width:18px;height:18px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(-3px)}50%{transform:translateX(5px)}}

/* ============ TICKETS ============ */
.ticket{
  position:relative;width:min(100%,420px);margin:0 auto;border-radius:24px;
  background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 1px var(--rule);
  transform:perspective(900px) rotateX(calc(var(--ry,0) * 1deg)) rotateY(calc(var(--rx,0) * 1deg));
  transition:transform .25s ease-out;
}
.t-top{padding:26px 26px 22px}
.t-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.t-city{font-weight:500;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.t-tag{font-size:13.5px;color:var(--accent)}
.t-when{display:flex;align-items:center;gap:20px;margin-top:20px}
.t-date{display:flex;align-items:center;gap:10px;padding-right:20px;border-right:1px solid var(--rule)}
.t-date b{font-family:"Italiana",Georgia,serif;font-weight:400;font-size:clamp(60px,17vw,76px);line-height:.85;color:var(--gold)}
.t-date span{font-family:"Marcellus",Georgia,serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;line-height:1.35}
.t-time span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.t-time b{display:block;font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(24px,6.6vw,30px);line-height:1.15;margin-top:2px}
.t-time small{display:block;font-size:12.5px;color:var(--gold);margin-top:2px}
.t-perf{position:relative;height:22px}
.t-perf::before{content:"";position:absolute;left:22px;right:22px;top:50%;border-top:1.5px dashed var(--rule)}
.t-perf::after{
  content:"";position:absolute;inset:0 -11px;
  background:radial-gradient(circle at 11px 50%,var(--notch) 10.5px,transparent 11.5px),
             radial-gradient(circle at calc(100% - 11px) 50%,var(--notch) 10.5px,transparent 11.5px);
}
.t-bot{padding:18px 26px 26px}
.t-venue{margin:0;font-family:"Marcellus",Georgia,serif;font-size:clamp(19px,5vw,22px);line-height:1.3}
.t-addr{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.t-count{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:20px;padding:14px 8px;border-radius:14px;background:var(--card)}
.t-count div{text-align:center}
.t-count b{display:block;font-weight:400;font-variant-numeric:tabular-nums;font-size:clamp(22px,6.2vw,28px);line-height:1;color:var(--ink)}
.t-count span{display:block;margin-top:6px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.t-count.short{display:block;text-align:center;font-family:"Marcellus",Georgia,serif;font-size:17px;letter-spacing:.06em}
.t-count .past{grid-column:1/-1;text-align:center;font-family:"Marcellus",Georgia,serif;font-size:16px}
.t-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.t-foil{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 32%,rgba(255,232,170,.55) 45%,rgba(255,255,255,.35) 50%,transparent 62%);
  background-size:260% 260%;
  background-position:calc(50% + var(--fx,0) * 55%) calc(50% + var(--fy,0) * 55%);
  mix-blend-mode:soft-light;transition:background-position .25s ease-out;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 16px;
  font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  text-decoration:none;color:var(--gold);cursor:pointer;
  border:1px solid var(--rule);border-radius:14px;background:transparent;
  transition:background .2s,color .2s,border-color .2s,transform .12s;
}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn svg{width:15px;height:15px;flex:none}

/* ============ BLESSINGS ============ */
.fams{display:grid;gap:26px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-width:720px;margin-inline:auto;text-align:center}
.fam .rel{margin:0;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.fam .par{margin:8px 0 0;font-family:"Marcellus",Georgia,serif;font-size:clamp(17px,4.4vw,21px);line-height:1.45}
.fam .child{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.fam .child b{font-weight:500;color:var(--gold)}
.close{text-align:center;margin-top:clamp(34px,6vh,54px)}
.blessing{font-family:"Italiana",Georgia,serif;font-size:clamp(24px,6.2vw,36px);line-height:1.45;letter-spacing:.03em;max-width:15em;margin:0 auto;text-wrap:balance}
.sig{margin:22px 0 0;font-size:clamp(20px,5vw,26px);color:var(--gold)}
.sig-en{margin:6px 0 0;font-family:"Marcellus",Georgia,serif;font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}
.acts .btn{padding-inline:22px}
.akshi{margin:14px auto 0;max-width:28em;font-size:12.5px;color:var(--muted)}
.akshi .telugu{color:var(--accent)}
.shower-note{margin:8px 0 0;min-height:1.5em;font-size:12px;letter-spacing:.06em;color:var(--gold)}
.foot{margin:clamp(34px,6vh,50px) 0 0;text-align:center;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* ============ MOTION ============ */
.js .reveal{opacity:0;transform:translateY(16px)}
.js .reveal.in{opacity:1;transform:none;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .reveal{opacity:1!important;transform:none!important;transition:none!important}
  .seal,.seal.sp-a,.sp-a,.card-face,.card-in,.swipe-cue svg,.hint::before{animation:none!important}
  .splash,.tabs,.ticket,.deck{transition:none!important}
}
</style>
